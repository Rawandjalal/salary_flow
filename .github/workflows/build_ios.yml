name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Application
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: |
          # Ensure we use the full Xcode.app (not CLT) which has all SDK specs
          XCODE=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -r | head -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -r | head -1)
          fi
          echo "Selecting Xcode: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcode-select -p
          xcodebuild -version
          # Verify WidgetKit spec is present
          find "$XCODE" -name "*.xcspec" 2>/dev/null | xargs grep -l "widgetkit-extension" 2>/dev/null \
            && echo "✅ WidgetKit spec found" \
            || echo "⚠️  WidgetKit spec not found in $XCODE"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify widget target in project
        run: |
          grep -c "SalaryFlowWidget" ios/Runner.xcodeproj/project.pbxproj \
            && echo "✅ WidgetKit target is in project.pbxproj" \
            || (echo "❌ WidgetKit target MISSING from project.pbxproj"; exit 1)

      - name: Build iOS App (Runner + Widget)
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee flutter_build.log || true
          # Fail on real build errors (not just signing complaints)
          if grep -q "Failed to build iOS app" flutter_build.log; then
            echo "=== BUILD FAILED ==="
            grep -E "^Error|error:" flutter_build.log | tail -30
            exit 1
          fi
          echo "✅ Build completed"

      - name: Find Runner.app (debug)
        run: |
          echo "=== In build/ directory ==="
          find build/ios -name "Runner.app" -type d 2>/dev/null | while read p; do
            echo "  Path : $p"
            echo "  Files: $(ls "$p" 2>/dev/null | wc -l | tr -d ' ') file(s)"
            echo "  Info.plist: $(test -f "$p/Info.plist" && echo YES || echo NO)"
            ls "$p" 2>/dev/null | head -10 || true
          done
          echo ""
          echo "=== In DerivedData (Release-iphoneos) ==="
          find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" \
            -path "*/Release-iphoneos/*" \
            -not -path "*/Index.noindex/*" 2>/dev/null | while read p; do
            echo "  Path : $p"
            echo "  Info.plist: $(test -f "$p/Info.plist" && echo YES || echo NO)"
            echo "  PlugIns: $(ls "$p/PlugIns" 2>/dev/null || echo none)"
          done

      - name: Create IPA
        run: |
          # ── 1. Best source: DerivedData (xcodebuild's own complete output) ──
          DERIVED_APP=$(
            find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" \
              -path "*/Release-iphoneos/*" \
              -not -path "*/Index.noindex/*" 2>/dev/null |
            while read p; do
              [ -f "$p/Info.plist" ] && echo "$p" && break
            done
          )

          # ── 2. Fallback: anywhere under build/ with a real Info.plist ──
          BUILD_APP=$(
            find build/ios -name "Runner.app" -type d 2>/dev/null |
            while read p; do
              [ -f "$p/Info.plist" ] && echo "$p" && break
            done
          )

          if [ -n "$DERIVED_APP" ]; then
            APP_PATH="$DERIVED_APP"
            echo "✓ Using DerivedData app: $APP_PATH"
          elif [ -n "$BUILD_APP" ]; then
            APP_PATH="$BUILD_APP"
            echo "✓ Using build-dir app:  $APP_PATH"
          else
            echo "ERROR: No Runner.app with Info.plist found anywhere."
            echo "--- flutter_build.log tail ---"
            tail -30 flutter_build.log || true
            exit 1
          fi

          echo "=== App bundle contents ==="
          ls -lh "$APP_PATH"
          echo ""
          echo "=== PlugIns (widget extensions) ==="
          ls -lh "$APP_PATH/PlugIns" 2>/dev/null || echo "(no PlugIns directory)"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -qr SalaryFlow.ipa Payload

          echo "=== IPA Info.plist check ==="
          unzip -l SalaryFlow.ipa | grep "Info.plist"
          ls -lh SalaryFlow.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalaryFlow-iOS-IPA
          path: SalaryFlow.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: flutter_build.log
          retention-days: 7
