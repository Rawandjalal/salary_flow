name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Application
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS App
        # Flutter exits with code 1 after a successful xcodebuild due to
        # its own signing validator. The complete Runner.app is placed by
        # xcodebuild into build/ios/Build/Products/Release-iphoneos/
        # BEFORE Flutter's signing check runs. We use || true to continue.
        run: flutter build ios --release --no-codesign || true

      - name: Locate and verify Runner.app
        run: |
          echo "=== Searching all possible output paths ==="
          find build/ios -name "Runner.app" -type d 2>/dev/null | while read p; do
            echo "Found: $p"
            echo "  Info.plist exists: $(test -f "$p/Info.plist" && echo YES || echo NO)"
          done

      - name: Create IPA
        run: |
          # Flutter's xcodebuild output is here (complete, with Info.plist)
          PRIMARY="build/ios/Build/Products/Release-iphoneos/Runner.app"
          FALLBACK=$(find build/ios -name "Runner.app" -type d 2>/dev/null | \
            while read p; do
              if [ -f "$p/Info.plist" ]; then echo "$p"; break; fi
            done)

          if [ -d "$PRIMARY" ] && [ -f "$PRIMARY/Info.plist" ]; then
            APP_PATH="$PRIMARY"
          elif [ -n "$FALLBACK" ]; then
            APP_PATH="$FALLBACK"
          else
            echo "ERROR: No complete Runner.app (with Info.plist) found"
            find build/ios -name "Runner.app" 2>/dev/null
            exit 1
          fi

          echo "Packaging app from: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -r SalaryFlow.ipa Payload
          echo "=== IPA Contents (top-level) ==="
          unzip -l SalaryFlow.ipa | grep "Info.plist" || echo "WARNING: Info.plist not found in IPA"
          ls -lh SalaryFlow.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalaryFlow-iOS-IPA
          path: SalaryFlow.ipa
          retention-days: 30
