name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Application
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Prepare Xcode project (config only)
        run: flutter build ios --release --config-only

      - name: Build with xcodebuild (no codesign)
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$PWD/build/ios/Runner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty || true

      - name: Create IPA from archive
        run: |
          APP_PATH=$(find "$PWD/build/ios/Runner.xcarchive" -name "*.app" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SalaryFlow.ipa Payload
          echo "IPA created successfully"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalaryFlow-iOS-IPA
          path: SalaryFlow.ipa
          retention-days: 30

